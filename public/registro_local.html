<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiCita - Registrar mi local</title>
    <link rel="stylesheet" href="estilos.css">
  </head>

  <body>
    <main class="caja login">
      <h1>Registrar mi local</h1>
      <p class="sub">Registra tu estética y administrá tus propios turnos</p>
      <input id="local" placeholder="Nombre de tu estética">
      <input id="nombre" placeholder="Tu nombre y apellido">
      <input id="email" type="email" placeholder="tu email">
      <input id="telefono" type="tel" placeholder="Teléfono con código de área (ej: 3764123456)">
      <input id="password" type="password" placeholder="Contraseña (mínimo 6)">
      <button id="btnLocal">Crear mi local</button>
      <p id="msg"></p>
      <a href="index.html">Ya tengo una cuenta</a>
    </main>

    <script src="config.js"></script>
    <script src="registro_local.js"></script>
    <script src="verpass.js"></script>
  </body>
</html>
